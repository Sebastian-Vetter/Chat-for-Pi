name: Publish release downloads
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify stable version tag
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "v$VERSION"
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("package.json")); if (!/^\d+\.\d+\.\d+$/.test(p.version)) process.exit(1);'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run package:build
      - name: Verify package contents and smoke test standalone app
        run: npm run package:verify
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            .release/pi-chat-extension-*.tgz \
            .release/pi-chat-app-*.tar.gz \
            .release/SHA256SUMS \
            --verify-tag --title "Chat for Pi ${GITHUB_REF_NAME}" \
            --notes-file .release/release-notes.md
